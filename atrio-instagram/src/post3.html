<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ATRIO Post 3</title>
<style>
  @font-face { font-family: Montserrat; font-weight: 300; src: url(fonts/montserrat-latin-300-normal.woff2) format('woff2'); }
  @font-face { font-family: Montserrat; font-weight: 400; src: url(fonts/montserrat-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: Montserrat; font-weight: 500; src: url(fonts/montserrat-latin-500-normal.woff2) format('woff2'); }
  html, body { margin: 0; background: #000; }
  .art { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #060606; font-family: Montserrat, sans-serif; color: #F3EDE2; }
  .layer { position: absolute; inset: 0; }
  /* fundo: a própria foto ampliada e desfocada, para estender o fundo do estúdio às laterais */
  .fill { background: url(img/julia-afastada.jpg) center/190% auto no-repeat; filter: blur(70px) brightness(.9); transform: scale(1.25); }
  .photo { position: absolute; top: 0; left: 306px; width: 753px; height: 1350px;
      background: url(img/julia-afastada.jpg) center/100% 100% no-repeat;
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 22%, #000 78%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 22%, #000 78%, transparent 100%); }
  /* gradação: foco de luz nela, bordas caindo para o preto da série */
  .grade { background:
      radial-gradient(720px 1000px at 682px 720px, transparent 36%, rgba(0,0,0,.40) 68%, rgba(0,0,0,.86) 100%),
      linear-gradient(90deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.30) 34%, transparent 52%),
      linear-gradient(0deg, rgba(0,0,0,.30) 0%, transparent 20%),
      linear-gradient(180deg, rgba(0,0,0,.55) 0%, transparent 22%); }
  .mark { position: absolute; left: 86px; top: 84px; width: 84px; mix-blend-mode: screen; }
  .label { position: absolute; left: 96px; bottom: 296px; font-weight: 500; font-size: 15px; letter-spacing: .42em; opacity: .72; }
  .rule { position: absolute; left: 96px; bottom: 270px; width: 44px; height: 1px; background: rgba(243,237,226,.6); }
  h1 { position: absolute; left: 96px; bottom: 96px; margin: 0; font-weight: 300; font-size: 38px; line-height: 1.26; letter-spacing: .13em; text-transform: uppercase; }
  .grain { opacity: .14; mix-blend-mode: overlay; }
</style>
</head>
<body>
<div class="art" id="art">
  <div class="layer fill"></div>
  <div class="photo"></div>
  <div class="layer grade"></div>
  <img class="mark" src="img/simbolo-a.png" alt="">
  <div class="label">QUEM SOMOS</div>
  <div class="rule"></div>
  <h1>Por trás de<br>cada imagem,<br>um olhar.</h1>
  <svg class="layer grain" width="1080" height="1350">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>
</div>
</body>
</html>
