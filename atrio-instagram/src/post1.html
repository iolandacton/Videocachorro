<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ATRIO Post 1</title>
<style>
  :root { --off: 243,237,226; }
  html, body { margin: 0; background: #000; }
  .art { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #070707; }
  .layer { position: absolute; inset: 0; }
  /* ambiente: leve luz quente no alto à esquerda */
  .ambient { background:
      radial-gradient(900px 700px at 18% -6%, rgba(var(--off), .13), transparent 62%),
      radial-gradient(700px 520px at 50% 42%, rgba(var(--off), .055), transparent 70%); }
  /* feixes: acompanham a inclinação da haste do A */
  .beam { position: absolute; left: 50%; top: 50%; transform-origin: center; }
  .beam.wide  { width: 520px; height: 2600px; margin: -1300px 0 0 -330px; transform: rotate(-39deg);
      background: linear-gradient(90deg, transparent 0%, rgba(var(--off), .06) 30%, rgba(var(--off), .14) 50%, rgba(var(--off), .06) 70%, transparent 100%);
      filter: blur(38px);
      -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 46%, rgba(0,0,0,.35) 62%, transparent 78%); mask-image: linear-gradient(180deg, #000 0%, #000 46%, rgba(0,0,0,.35) 62%, transparent 78%); }
  .beam.core  { width: 150px; height: 2600px; margin: -1300px 0 0 -150px; transform: rotate(-39deg);
      background: linear-gradient(90deg, transparent, rgba(var(--off), .13) 50%, transparent);
      filter: blur(22px);
      -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 44%, transparent 66%); mask-image: linear-gradient(180deg, #000 0%, #000 44%, transparent 66%); }
  .beam.edge  { width: 3px; height: 2600px; margin: -1300px 0 0 60px; transform: rotate(-39deg);
      background: rgba(var(--off), .22); filter: blur(1.2px);
      -webkit-mask-image: linear-gradient(180deg, transparent 3%, #000 13%, #000 22%, transparent 32%); mask-image: linear-gradient(180deg, transparent 3%, #000 13%, #000 22%, transparent 32%); }
  /* piso de pedra polida */
  .floor { top: 814px; background:
      linear-gradient(180deg, rgba(var(--off), .075) 0px, rgba(var(--off), .02) 2px, transparent 140px),
      radial-gradient(760px 300px at 50% 0%, rgba(var(--off), .075), transparent 72%),
      linear-gradient(180deg, #0b0b0b, #040404 70%); }
  .horizon { position: absolute; left: 0; right: 0; top: 813px; height: 1px;
      background: linear-gradient(90deg, transparent 6%, rgba(var(--off), .30) 38%, rgba(var(--off), .42) 52%, rgba(var(--off), .22) 68%, transparent 94%); }
  .logo { position: absolute; left: 90px; top: 130px; width: 900px; height: 900px; mix-blend-mode: screen; }
  .reflection { position: absolute; left: 90px; top: 598px; width: 900px; height: 900px; mix-blend-mode: screen;
      transform: scaleY(-1); opacity: .34; filter: blur(2px);
      -webkit-mask-image: linear-gradient(180deg, transparent 24%, rgba(0,0,0,.22) 46%, rgba(0,0,0,.8) 60%, #000 70%); mask-image: linear-gradient(180deg, transparent 24%, rgba(0,0,0,.22) 46%, rgba(0,0,0,.8) 60%, #000 70%); }
  .halo { background: radial-gradient(520px 300px at 50% 43%, rgba(var(--off), .075), transparent 70%); }
  canvas { position: absolute; inset: 0; }
  .vignette { background: radial-gradient(120% 95% at 50% 44%, transparent 42%, rgba(0,0,0,.62) 78%, rgba(0,0,0,.93) 100%); }
  .grain { opacity: .16; mix-blend-mode: overlay; }
</style>
</head>
<body>
<div class="art" id="art">
  <div class="layer ambient"></div>
  <div class="beam wide"></div>
  <div class="beam core"></div>
  <div class="beam edge"></div>
  <div class="layer floor"></div>
  <div class="horizon"></div>
  <div class="layer halo"></div>
  <canvas id="dust" width="1080" height="1350"></canvas>
  <img class="reflection" src="../logo-atrio-oficial.png" alt="">
  <img class="logo" src="../logo-atrio-oficial.png" alt="ATRIO Estúdio Criativo">
  <div class="layer vignette"></div>
  <svg class="layer grain" width="1080" height="1350">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>
</div>
<script>
  // poeira fina dentro do feixe, com semente fixa para o resultado ser reprodutível
  let s = 20261117; const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  const c = document.getElementById('dust').getContext('2d');
  const ang = -39 * Math.PI / 180, cx = 540 - 70, cy = 675;
  for (let i = 0; i < 520; i++) {
    const along = (rnd() - .62) * 1500;            // ao longo do feixe, mais densa no alto
    const g = (rnd() + rnd() + rnd() - 1.5) / 1.5;  // distribuição concentrada no eixo
    const across = g * 300;
    const x = cx + across * Math.cos(ang) - along * Math.sin(ang);
    const y = cy + across * Math.sin(ang) + along * Math.cos(ang);
    if (y > 800) continue;
    const r = .4 + rnd() * rnd() * 2.2;
    const a = (.05 + rnd() * .30) * (1 - Math.abs(g)) ;
    c.beginPath(); c.fillStyle = `rgba(243,237,226,${a.toFixed(3)})`;
    c.shadowColor = 'rgba(243,237,226,.5)'; c.shadowBlur = r * 3;
    c.arc(x, y, r, 0, 6.283); c.fill();
  }
</script>
</body>
</html>
